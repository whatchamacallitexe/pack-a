name: Localize CDN assets

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare localizer tools
        run: |
          set -euo pipefail
          rm -rf /tmp/cdn-tools
          mkdir -p /tmp/cdn-tools
          if [ -f scripts/localize_cdn.py ]; then
            cp scripts/localize_cdn.py scripts/patch_localizer.py /tmp/cdn-tools/
          else
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/whatchamacallitexe/pack-a.git /tmp/cdn-tools
            git -C /tmp/cdn-tools sparse-checkout set scripts
            cp /tmp/cdn-tools/scripts/localize_cdn.py /tmp/cdn-tools/scripts/patch_localizer.py /tmp/cdn-tools/
          fi
          python3 /tmp/cdn-tools/patch_localizer.py

      - name: Copy CDN files into the repo and rewrite game pages
        run: python3 /tmp/cdn-tools/localize_cdn.py "$GITHUB_WORKSPACE"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Localize CDN game assets for offline use"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD; then
              echo "Push OK"
              exit 0
            fi
            echo "Push rejected, retry $i"
            sleep 5
          done
          exit 1
